aid: superpedestrian
name: Superpedestrian
description: >-
  Superpedestrian was a Cambridge, Massachusetts micromobility company founded in December 2012 by
  MIT Senseable City Lab co-inventor Assaf Biderman. It built the Copenhagen Wheel electric bicycle
  retrofit (2017) and then the LINK shared e-scooter fleet (2020), whose differentiator was an
  onboard Vehicle Intelligence System running self-diagnostic safety checks on every ride. It raised
  roughly $185M (a $60M round in December 2020 and a $125M Series C in February 2022 with Citi
  Impact Fund and Sony Innovation Fund) and at its 2022 peak ran shared fleets in about 57 cities
  across eleven US states and seven European countries. Superpedestrian closed its US operations on
  31 December 2023 and auctioned more than 20,000 scooters in January 2024; the European business
  was sold to Norway's SURF Beyond in February 2024 and subsequently folded into ZEUS Mobility. The
  company published no public developer program and no machine-readable API contract. Its only known
  machine-readable surface was per-city GBFS feeds served for host cities at mds.linkyour.city, which
  are offline. Both superpedestrian.com and link.city are now parked domains that answer HTTP 200 to
  every path with a domain-parking lander, and link.city is delegated to afternic.com nameservers
  and listed for sale.
